---#classify_utterances

Read the text carefully and classify it:

<text>
{{utterance_text}}
</text>

¡BEGIN

Consider the last utterance? What type of utterance is it?

- question
- advice or suggestion
- reflection (e.g. repeating or rephrasing the previous utterance)
- statement
- other


Remember that questions can be implied (e.g. via a statement) as well as explicit. Implied questions are still questions.

Pay attention to whether a question is open or closed. A closed question restricts the range of possible replies: e.g. to a yes/no, or to give a number. An open question allows much more leeway to respond, perhaps in extended form.

[[pick:utterance_type|open_question,closed_question,statement,advice_suggestion,other]]


¡OBLIVIATE

Does the therapist respond with reflection? Use a defintion of reflection based on Motivational Interviewing.

Respond `yes` if reflection is present, `no` for no reflection, and `unclear` if it's not clear: [[pick:reflection|yes,no,unclear]]
