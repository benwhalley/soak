site_name: soak-llm
site_description: DAG-based pipelines for LLM-assisted qualitative text analysis
site_url: https://github.com/benwhalley/soak
repo_url: https://github.com/benwhalley/soak
repo_name: benwhalley/soak

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Tutorials:
      - Getting Started: tutorials/getting-started.md
      - Customizing Your Analysis: tutorials/customizing-analysis.md
      - Working with Results: tutorials/working-with-results.md
  - How-To Guides:
      - Thematic Analysis: how-to/thematic-analysis.md
      - Working with Spreadsheet Data: how-to/working-with-spreadsheet-data.md
      - Pre-extraction Workflow: how-to/pre-extract-workflow.md
      - Ground Truth Validation: how-to/ground-truth-validation.md
      - Adapting Pipelines: how-to/adapting-pipelines.md
  - Explanation:
      - What is soak?: explanation/what-is-soak.md
      - Calibration: explanation/calibration.md
      - Advanced Coverage Methods: explanation/hyde-coverage.md
      - Quote Verification Approach: explanation/quote-verification-approach.md
  - Papers:
      - Methods Paper Draft: papers/methods-paper-draft-1.md
  - Reference:
      - CLI Reference: reference/cli.md
      - Node Reference: reference/node-reference.md
      - Quote Verification: reference/quote-verification.md

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/benwhalley/soak
